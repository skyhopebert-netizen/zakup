<script>
  // ============================================
  // НАСТРОЙКИ SUPABASE
  // ============================================
  const SUPABASE_URL = 'https://whselnzhzbvxtkncausz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_PChhLBXS8la2mQUFa6AMwQ_jlqptKdI';
  const SB_TABLE = 'app_storage';
  const SB_REST = `${SUPABASE_URL}/rest/v1/${SB_TABLE}`;

  // ============================================
  // window.storage — реализация поверх Supabase REST API
  // Совместима по сигнатуре с window.storage из артефактов Claude:
  //   get(key, shared) -> {key, value, shared} | null
  //   set(key, value, shared) -> {key, value, shared} | null
  // Параметр shared здесь не используется для разделения данных
  // (в нашем случае ВСЕ данные общие для всей команды — это и было целью),
  // но сохранён для совместимости вызовов в коде приложения.
  // Имя бариста (shared:false в исходном коде) хранится в localStorage,
  // чтобы оставаться личным на конкретном устройстве.
  // ============================================
  window.storage = {
    async get(key, shared) {
      if (shared === false) {
        // Личные данные устройства — localStorage
        const v = localStorage.getItem('local_' + key);
        if (v === null) throw new Error('not found');
        return { key, value: v, shared: false };
      }
      try {
        const res = await fetch(
          `${SB_REST}?key=eq.${encodeURIComponent(key)}&select=value`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
            },
          }
        );
        if (!res.ok) throw new Error('fetch failed');
        const rows = await res.json();
        if (!rows || rows.length === 0) throw new Error('not found');
        return { key, value: rows[0].value, shared: true };
      } catch (e) {
        throw e;
      }
    },

    async set(key, value, shared) {
      if (shared === false) {
        localStorage.setItem('local_' + key, value);
        return { key, value, shared: false };
      }
      try {
        const res = await fetch(SB_REST, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates,return=representation',
          },
          body: JSON.stringify({ key, value }),
        });
        if (!res.ok) {
          const txt = await res.text();
          console.error('Supabase set error:', txt);
          return null;
        }
        return { key, value, shared: true };
      } catch (e) {
        console.error('Supabase set exception:', e);
        return null;
      }
    },

    async delete(key, shared) {
      if (shared === false) {
        localStorage.removeItem('local_' + key);
        return { key, deleted: true, shared: false };
      }
      try {
        const res = await fetch(`${SB_REST}?key=eq.${encodeURIComponent(key)}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
          },
        });
        return { key, deleted: res.ok, shared: true };
      } catch (e) {
        return null;
      }
    },

    async list(prefix, shared) {
      try {
        let url = `${SB_REST}?select=key`;
        if (prefix) url += `&key=like.${encodeURIComponent(prefix)}*`;
        const res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
          },
        });
        if (!res.ok) throw new Error('list failed');
        const rows = await res.json();
        return { keys: rows.map(r => r.key), prefix, shared: true };
      } catch (e) {
        return null;
      }
    },
  };
</script>

<script>
// ─── Push-уведомления ────────────────────────────────────
const PUSH_SERVER = 'https://zakup-push.onrender.com';

// Утилита: конвертация VAPID public key
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.log('Push не поддерживается в этом браузере');
    return;
  }

  try {
    // Регистрируем Service Worker
    const reg = await navigator.serviceWorker.register('/zakup/sw.js');
    console.log('[SW] Зарегистрирован');

    // Запрашиваем разрешение на уведомления
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      console.log('Уведомления не разрешены');
      return;
    }

    // Получаем публичный VAPID-ключ с сервера
    const keyRes = await fetch(`${PUSH_SERVER}/vapid-public-key`);
    const { key } = await keyRes.json();

    // Подписываемся на push
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      console.log('[Push] Уже подписан');
      return;
    }

    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(key),
    });

    // Отправляем подписку на сервер
    await fetch(`${PUSH_SERVER}/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription),
    });
    console.log('[Push] Подписка сохранена на сервере');

  } catch (e) {
    console.warn('[Push] Ошибка настройки:', e.message);
  }
}

// Делаем setupPush глобальной — вызывается по нажатию кнопки в приложении
window.setupPush = setupPush;

// При загрузке только регистрируем SW, без запроса разрешения
window.addEventListener('load', async () => {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('/zakup/sw.js');
      console.log('[SW] Зарегистрирован');
    } catch (e) {
      console.warn('[SW] Ошибка:', e.message);
    }
  }
});
</script>
